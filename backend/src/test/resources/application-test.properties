# Used only by tests (@ActiveProfiles("test")): an in-memory H2 database, so tests
# run without PostgreSQL and every run starts with empty tables.
spring.datasource.url=jdbc:h2:mem:truetrack_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Test-only values (not real secrets)
app.jwt.secret=test-only-secret-key-for-junit-0123456789abcdef
app.jwt.expiration-hours=24
app.cors.allowed-origins=http://localhost:5173
