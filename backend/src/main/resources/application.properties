# ============================================================
# True Track backend configuration
# Values in ${...} come from environment variables.
# The part after ":" is the default used when the variable is not set.
# Secrets (DB_PASSWORD, JWT_SECRET) have NO default on purpose -
# set them before starting the app (see README.md).
# ============================================================

server.port=${PORT:8080}

# ---------- PostgreSQL ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/truetrack}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# ---------- JPA / Hibernate ----------
# "update" lets Hibernate create/alter the tables from the @Entity classes.
# Simple for learning; database/schema.sql shows the equivalent SQL.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- JSON ----------
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- JWT ----------
# Must be at least 32 characters. Example to generate one: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}

# ---------- CORS ----------
# Comma-separated list of frontend URLs allowed to call this API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
